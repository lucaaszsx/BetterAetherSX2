# Checks on every push to main and every pull request. Sanitizers, fuzzing and differential runs join with the code
# they test.
name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    format:
        name: C++ formatting
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v4
            -   name: Install clang-format
                run: sudo apt-get update && sudo apt-get install --yes clang-format
            -   name: Check formatting
                run: git ls-files -z 'core/*.cpp' 'core/*.h' 'core/*.hpp' 'android/*.cpp' 'android/*.h' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

    scripts:
        name: Shell scripts and workflows
        runs-on: ubuntu-24.04
        env:
            SHELLCHECK_VERSION: 0.11.0
            ACTIONLINT_VERSION: 1.7.12
        steps:
            -   uses: actions/checkout@v4
            -   name: Install shellcheck and actionlint
                run: |
                    mkdir -p "$RUNNER_TEMP/bin"
                    curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
                        | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/bin" "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
                    curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
                        | tar -xz -C "$RUNNER_TEMP/bin" actionlint
                    echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            -   name: Check shell scripts
                run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck
            # actionlint also runs shellcheck on each workflow's run: blocks.
            -   name: Check workflows
                run: actionlint

    core:
        name: Native core (host build and tests)
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v4
            -   name: Install toolchain
                run: sudo apt-get update && sudo apt-get install --yes ninja-build libgtest-dev
            -   name: Configure
                run: cmake -S core -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release
            -   name: Build
                run: cmake --build build/core
            -   name: Test
                run: ctest --test-dir build/core --output-on-failure

    difftest-arm64:
        name: EE differential tests (Linux arm64)
        runs-on: ubuntu-24.04-arm
        env:
            DEPS_PREFIX: ${{ github.workspace }}/build/host-deps
            CC: clang
            CXX: clang++
        steps:
            -   uses: actions/checkout@v4
                with:
                    submodules: true
            -   name: Install system libraries
                run: |
                    sudo apt-get update
                    sudo apt-get install --yes ninja-build libcurl4-openssl-dev libpcap-dev libfontconfig-dev \
                        libudev-dev libx11-dev libxrandr-dev libxi-dev libdbus-1-dev zlib1g-dev
            # Restore and save are separate steps so the dependencies are cached even when a later step fails.
            -   name: Restore dependencies
                id: deps-cache
                uses: actions/cache/restore@v4
                with:
                    path: build/host-deps
                    key: host-deps-arm64-${{ hashFiles('android/deps/build-deps.sh') }}
            -   name: Build dependencies
                if: steps.deps-cache.outputs.cache-hit != 'true'
                run: mkdir -p build && cd build && ../android/deps/build-deps.sh --host "$DEPS_PREFIX"
            -   name: Save dependencies
                if: steps.deps-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: build/host-deps
                    key: ${{ steps.deps-cache.outputs.cache-primary-key }}
            -   name: Apply our patches to PCSX2
                run: upstream/apply-patches.sh
            -   name: Configure
                run: |
                    cmake -S upstream/pcsx2 -B build/difftest -G Ninja -DCMAKE_BUILD_TYPE=Release \
                        -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF \
                        -DUSE_VULKAN=OFF -DUSE_OPENGL=OFF -DWAYLAND_API=OFF -DUSE_BACKTRACE=OFF \
                        -DPCSX2_EXTERNAL_FRONTEND_DIR="$GITHUB_WORKSPACE/core/difftest"
            -   name: Build
                run: cmake --build build/difftest --target bax_difftest
            -   name: Run 100k cases per class
                run: |
                    tester=$(find build/difftest -name bax_difftest -type f -executable)
                    for class in alu shift; do
                        LD_LIBRARY_PATH="$DEPS_PREFIX/lib" "$tester" "$class" 100000 1
                    done
            # A deliberately wrong candidate must be reported, or the comparison is not checking anything.
            -   name: Check that a divergence is caught
                run: |
                    tester=$(find build/difftest -name bax_difftest -type f -executable)
                    # Exit code 1 means a reported divergence; a crash would exit otherwise and prove nothing.
                    status=0
                    LD_LIBRARY_PATH="$DEPS_PREFIX/lib" "$tester" alu 1000 1 --mutate || status=$?
                    test "$status" -eq 1

    android:
        name: Android app (native core, lint, tests, debug APK)
        runs-on: ubuntu-24.04
        env:
            NDK_VERSION: 30.0.16248370
            DEPS_PREFIX: ${{ github.workspace }}/build/android-deps
        steps:
            -   uses: actions/checkout@v4
                with:
                    submodules: true
            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 17
            -   uses: gradle/actions/setup-gradle@v4
            -   name: Install NDK
                run: |
                    sudo apt-get update && sudo apt-get install --yes ninja-build
                    yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
                    echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
            # Restore and save are separate steps so the dependencies are cached even when a later step fails.
            -   name: Restore dependencies
                id: deps-cache
                uses: actions/cache/restore@v4
                with:
                    path: build/android-deps
                    key: android-deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/build-deps.sh') }}
            -   name: Build dependencies
                if: steps.deps-cache.outputs.cache-hit != 'true'
                run: mkdir -p build && cd build && ../android/deps/build-deps.sh "$ANDROID_NDK" "$DEPS_PREFIX"
            -   name: Save dependencies
                if: steps.deps-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: build/android-deps
                    key: ${{ steps.deps-cache.outputs.cache-primary-key }}
            -   name: Lint, unit tests and debug build
                working-directory: android
                run: ./gradlew ktlintCheck detekt testDebugUnitTest assembleDebug -Pbax.depsDir="$DEPS_PREFIX"
            -   name: Merged manifest has no INTERNET permission
                working-directory: android
                run: |
                    manifest=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -n 1)
                    test -n "$manifest"
                    ! grep -q 'android.permission.INTERNET' "$manifest"
            -   name: Upload debug APK
                uses: actions/upload-artifact@v4
                with:
                    name: debug-apk
                    path: android/app/build/outputs/apk/debug/*.apk
                    retention-days: 7
            # The APK carries a stripped libbax.so; this copy keeps the symbols, to turn device crash addresses into
            # function names.
            -   name: Upload native symbols
                uses: actions/upload-artifact@v4
                with:
                    name: native-symbols
                    path: android/app/build/intermediates/cxx/**/obj/arm64-v8a/libbax.so
                    retention-days: 7
            -   name: Upload device test tools
                uses: actions/upload-artifact@v4
                with:
                    name: device-tests
                    path: |
                        android/app/build/intermediates/cxx/**/obj/arm64-v8a/bax_difftest
                        android/app/.cxx/**/bax_difftest
                    if-no-files-found: error
                    retention-days: 7
