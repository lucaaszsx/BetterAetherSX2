# Overrides on top of detekt's default rules.
style:
    # A literal assigned to a named property (a color token, a spacing value) is the constant itself.
    MagicNumber:
        ignorePropertyDeclaration: true
    # Single-statement blocks stay on one line without braces.
    BracesOnIfStatements:
        active: true
        singleLine: never
        multiLine: always
    ForbiddenComment:
        active: true
        comments:
            -   value: 'TODO:'
                reason: 'Write TODO(#issue) with an issue ID.'

complexity:
    # EmulatorRuntime is the one boundary between the UI and the core, with one function per operation; overrides of
    # it are counted there, not again in each implementation.
    TooManyFunctions:
        thresholdInInterfaces: 20
        ignoreOverridden: true
    # A screen takes its state and callbacks as parameters; grouping them into a holder would only rename them.
    LongParameterList:
        ignoreAnnotated: ['Composable']

naming:
    # Composable functions are named like types.
    FunctionNaming:
        ignoreAnnotated: ['Composable']
